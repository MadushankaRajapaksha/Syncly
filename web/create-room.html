<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Room - Syncly - Watch together. Stay together</title>
    <link rel="stylesheet" href="/static/css/style.css?v=5" />
  </head>
  <body>
    <nav>
      <h1 class="logo">Syncly</h1>
      <ul class="items">
        <li>Home</li>
        <li>Features</li>
        <li>How this work</li>
      </ul>
      <a href="/room" class="nav-cta"> Create Room</a>
    </nav>
    <div class="form">
      <!-- user profile create  -->
      <fieldset class="profileData">
        <!-- profile piture select round  -->
        <h1>Create you profile first</h1>
        <img
          src="/static/profile_pitures/Pug_wearing_.jpg"
          alt=""
          class="profileImage"
        />
        <p class="changePhoto">Change Photo</p>

        <!-- username -->

        <div class="usernameIn">
          <label for="username">User Name* : </label>
          <input
            type="name"
            name="username"
            id="username"
            placeholder="A name thats you friends call you!"
            require
          />
        </div>
        <!-- email  -->
        <div class="emailIn">
          <label for="email">Emaill Adress* : </label>
          <input
            type="email"
            name="email"
            id="emaill"
            placeholder="A address get you maill in internet!"
            required
          />
        </div>
        <!-- show error masg wehn have erro -->
        <div class="erroMsgPro" style="display: none">
          <p></p>
        </div>
        <button class="nxt-Btn">Next</button>

        <!-- nextbutton -->
      </fieldset>
      <!-- room create  -->
      <fieldset class="roomData" style="display: none">
        <h1>Let's config our room!</h1>
        <!-- room name  -->
        <div class="rooNameIn">
          <label for="roomName">Room Name* : </label>
          <input
            type="name"
            name="roomName"
            id="roomName"
            placeholder="Name room with cool name!"
            require
          />
        </div>
        <!-- streaming url  -->
        <div class="streamUrlIn">
          <label for="streamUrl">Stream Url* : </label>
          <input
            type="url"
            name="streamUrl"
            id="streamUrl"
            placeholder="Add your video path with url..."
            require
          />
        </div>
        <!-- subtitle url  -->
        <div class="subtitleUrlIn">
          <label for="subtitleUrl">Sutitle Url : </label>
          <input
            type="url"
            name="subtitleUrl"
            id="subtitleUrl"
            placeholder="Add your subtitles path with url..."
          />
        </div>
        <!-- public togle  -->
        <div class="isRoomPrivetIn">
          <label for="toggle">Make Room Privet : </label>
          <div>
            <input
              type="checkbox"
              name="isRoomPrivet"
              id="toggle"
              class="toggle"
            />
            <label
              for="toggle"
              class="toggle-l"
              role="switch"
              aria-checked="false"
            >
              <span class="toggle-tumb"></span>
            </label>
          </div>
        </div>
        <!-- if privet invite code - coustem one (passcode) -->
        <div class="passcodeIn" style="display: none">
          <label for="passcode">Secret Code for Enter Room * : </label>
          <input
            type="text"
            name="passcode"
            min="4"
            max="4"
            placeholder="4-digit"
            id="passcode"
          />
        </div>
        <!-- show error masg wehn have erro -->
        <div class="erroMsgRoom" style="display: none">
          <p></p>
        </div>
        <!-- next button  -->
        <button class="createRoomBtn">Create Room</button>
      </fieldset>
      <!-- loading screen  -->
      <div class="creatingRoom" style="display: none">
        <h1>Room is prepiaring...</h1>
        <!-- loading animation -->
        <div class="loder"></div>
        <span class="lable">give me second</span>
      </div>

      <!-- room created succes  -->
      <div class="roomCreated" style="display: none">
        <h1>Grate Job, room created!</h1>
         

        <!-- succes icon with svg  -->
        <svg
          width="128px"
          height="128px"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 2C6.49 2 2 6.49 2 12C2 17.51 6.49 22 12 22C17.51 22 22 17.51 22 12C22 6.49 17.51 2 12 2ZM16.78 9.7L11.11 15.37C10.97 15.51 10.78 15.59 10.58 15.59C10.38 15.59 10.19 15.51 10.05 15.37L7.22 12.54C6.93 12.25 6.93 11.77 7.22 11.48C7.51 11.19 7.99 11.19 8.28 11.48L10.58 13.78L15.72 8.64C16.01 8.35 16.49 8.35 16.78 8.64C17.07 8.93 17.07 9.4 16.78 9.7Z"
            fill="#3a3f9d"
          />
        </svg>

        <button class="openRoomBtn ">
          Open Room
        </button>
      </div>

      <div></div>
    </div>
    <script>
      // select elmet in DOM
      const nextInProfile = document.querySelector(`.nxt-Btn`);
      const profileDataField = document.querySelector(`.profileData`);
      const roomDataField = document.querySelector(`.roomData`);

      const createRoomBtn = document.querySelector(`.createRoomBtn`);
      const usernameInp = document.querySelector(`#username`);
      const emaillInp = document.querySelector(`#emaill`);

      const roomNameInp = document.querySelector(`#roomName`);
      const streamUrlInp = document.querySelector(`#streamUrl`);
      const subtitleUrlInp = document.querySelector(`#subtitleUrl`);
      const passcodeInp = document.querySelector(`#passcode`);

      const errMsgInProfile = document.querySelector(`.erroMsgPro p`);
      const errMsgInRoom = document.querySelector(`.erroMsgRoom p`);

      const roomIsPrivet = document.querySelector(`#toggle`);
      const passcodeIn = document.querySelector(`.passcodeIn`);
      const toggleLable = document.querySelector(`.toggle-l`);


      const lodingScreen = document.querySelector(`.creatingRoom`)
      const succesScreen = document.querySelector(`.roomCreated`)

      let username = "";
      let email = "";
      // profilePiture <-todo

      let roomName = "";
      let streamUrl = "";
      let subtitleUrl = "";
      let isRoomPrivet = false;
      let passcode = null;

      // if (!nextInProfile){
      //     return;
      // }

      // a resuble navigation fucntion  handler screen hide/display in form 

      function popScreen(prev,next){
        prev.style.display = "none";
        next.style.display = "flex";
      }

      const createRoomSend = async (room) => {
        try {
          const res = await fetch("/api/room", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(room),
          });

          return res;
        } catch (e) {
          console.log(e);
          return e;
        }
      };
      // message model
      const showMsg = (m) => {
        console.log(m);
        document.querySelector(".erroMsgRoom").style.display = "flex";
        errMsgInProfile.innerHTML = m;
      };

      // toggle room is privet handler
      roomIsPrivet.addEventListener("change", () => {
        isRoomPrivet = roomIsPrivet.checked;
        toggleLable.setAttribute("aria-checked", String(roomIsPrivet.checked));
        passcodeIn.style.display = roomIsPrivet.checked ? "flex" : "none";
      });

      // handle nextbutton profiledata
      nextInProfile.addEventListener("click", () => {
        username = usernameInp.value.trim();
        emaill = emaillInp.value.trim();

        // validat data inputs: precentation cheack
        if (username.trim() !== " " && emaill.trim() !== "") {
          // is not " " and not null - > save data and go to nextstep.
          // hide profilData form and show next room data form
          
          popScreen(profileDataField,roomDataField)
          // profileDataField.style.display = "none";
          // roomDataField.style.display = "flex";
        } else {
          // else show input are misiisng and stat taht stage
          document.querySelector(".erroMsgPro").style.display = "flex";
          errMsgInProfile.innerHTML =
            "You can't be here without username and emaill!";
        }
      });

      // handle create room
      createRoomBtn.addEventListener("click", async () => {
        roomName = roomNameInp.value.trim();
        streamUrl = streamUrlInp.value.trim();
        subtitleUrl = subtitleUrlInp.value.trim();

        passcode = passcodeInp.value.trim();

        // checke required datas is have with presnt cheack
        const requiredOk = roomName !== "" && streamUrl !== "";

        if (!requiredOk) {
          // ..show message
          showMsg("you cant create room without name and streamURL, required!");
        }

        if (isRoomPrivet) {
          if (passcode.length !== 4) {
            showMsg("passcode should be 4-digit and secret!");
            return;
          }
        }

        // saveDate

        const room = {
          userData: {
            username,
            email,
            // profilepitrue
          },
          roomData: {
            roomName,
            streamUrl,
            subtitleUrl,
            isRoomPrivet,
            passcode: isRoomPrivet ? passcode : null,
          },
        };
        let res;
        //  sends to api
        try {
          // show loading
          popScreen(roomDataField,lodingScreen)
          res = await createRoomSend(room);
        } catch (e) {
          popScreen(lodingScreen,roomDataField)
          showMsg("Room Create ERROR : " + e.message);
          return;
        }

        // cheack response ins okey
        if (!res || !res.ok) {
          let data;
          try {
            data = await res.json();
          } catch (_) {
            data = { message: "Request failed with no JSON body" };
          }
          popScreen(lodingScreen,roomDataField)
          showMsg("ERROR : " + (data.message || JSON.stringify(data)));
          return;
        }

        // when succes room create /

        const data = await res.json();
        popScreen(lodingScreen,succesScreen)
        // showMsg("Succes, Rome has created!" + JSON.stringify(data, null, 2));

        // cheack response
      });
    </script>
  </body>
</html>
